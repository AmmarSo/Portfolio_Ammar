<!DOCTYPE html>
<html lang="fr" class="scroll-smooth dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - Ammar Souchon</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Grotesk', 'monospace'],
                    },
                    colors: {
                        primary: '#0ea5e9',
                        secondary: '#8b5cf6',
                        dark: '#020617',
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="bg-dark text-slate-50 selection:bg-primary selection:text-white">

    <!-- Canvas Background -->
    <canvas id="particles-canvas"></canvas>

    <!-- Navigation -->
    <nav class="fixed w-full z-50 glass transition-all duration-300 border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex-shrink-0 font-bold text-2xl tracking-tighter font-mono group">
                    <span class="text-primary group-hover:text-white transition-colors">← Retour</span>
                </a>

                <!-- Controls -->
                <div class="flex items-center space-x-4">
                    <button id="lang-toggle"
                        class="px-3 py-1 rounded-full border border-white/10 hover:border-primary/50 hover:bg-white/5 transition-all text-sm font-mono">
                        <span id="current-lang-flag">🇫🇷</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Project Detail Section -->
    <section class="min-h-screen pt-32 pb-20 relative">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8" id="project-content">
            <!-- Content injected via JS -->
            <div class="animate-pulse flex space-x-4">
                <div class="flex-1 space-y-6 py-1">
                    <div class="h-64 bg-slate-800 rounded-xl"></div>
                    <div class="space-y-3">
                        <div class="grid grid-cols-3 gap-4">
                            <div class="h-2 bg-slate-800 rounded col-span-2"></div>
                            <div class="h-2 bg-slate-800 rounded col-span-1"></div>
                        </div>
                        <div class="h-2 bg-slate-800 rounded"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-12 text-center text-slate-500 text-sm border-t border-white/5 bg-slate-950">
        <p>&copy; 2025 Ammar Souchon.</p>
    </footer>

    <!-- Main JS -->
    <script src="assets/js/main.js"></script>
</body>

</html>
