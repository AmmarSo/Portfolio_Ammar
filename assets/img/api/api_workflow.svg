<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#0f172a" rx="10" ry="10"/>
    
    <text x="400" y="40" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24" font-weight="bold">Steps to Create an API</text>
    
    <g transform="translate(50, 100)">
        <!-- Step 1 -->
        <rect x="0" y="0" width="100" height="60" rx="5" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
        <text x="50" y="25" text-anchor="middle" fill="white" font-family="sans-serif" font-size="10">1. Define</text>
        <text x="50" y="40" text-anchor="middle" fill="white" font-family="sans-serif" font-size="10">Objective</text>
        
        <!-- Arrow -->
        <line x1="100" y1="30" x2="130" y2="30" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    </g>

    <g transform="translate(180, 100)">
        <!-- Step 2 -->
        <rect x="0" y="0" width="100" height="60" rx="5" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
        <text x="50" y="25" text-anchor="middle" fill="white" font-family="sans-serif" font-size="10">2. Database</text>
        <text x="50" y="40" text-anchor="middle" fill="white" font-family="sans-serif" font-size="10">Architecture</text>
        
        <!-- Arrow -->
        <line x1="100" y1="30" x2="130" y2="30" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    </g>

    <g transform="translate(310, 100)">
        <!-- Step 3 -->
        <rect x="0" y="0" width="100" height="60" rx="5" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
        <text x="50" y="25" text-anchor="middle" fill="white" font-family="sans-serif" font-size="10">3. Import</text>
        <text x="50" y="40" text-anchor="middle" fill="white" font-family="sans-serif" font-size="10">Data</text>
        
        <!-- Arrow -->
        <line x1="100" y1="30" x2="130" y2="30" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    </g>

    <g transform="translate(440, 100)">
        <!-- Step 4 -->
        <rect x="0" y="0" width="100" height="60" rx="5" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
        <text x="50" y="25" text-anchor="middle" fill="white" font-family="sans-serif" font-size="10">4. Code</text>
        <text x="50" y="40" text-anchor="middle" fill="white" font-family="sans-serif" font-size="10">(Flask)</text>
        
        <!-- Arrow -->
        <line x1="100" y1="30" x2="130" y2="30" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    </g>

    <g transform="translate(570, 100)">
        <!-- Step 5 -->
        <rect x="0" y="0" width="100" height="60" rx="5" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
        <text x="50" y="35" text-anchor="middle" fill="white" font-family="sans-serif" font-size="10">5. Deployment</text>
    </g>

    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
        </marker>
    </defs>
</svg>
