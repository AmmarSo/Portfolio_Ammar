<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#0f172a" rx="10" ry="10"/>
    
    <text x="400" y="40" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24" font-weight="bold">How an API Works</text>
    
    <!-- Client -->
    <g transform="translate(100, 150)">
        <rect x="0" y="0" width="120" height="100" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
        <text x="60" y="55" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16">Client</text>
        <text x="60" y="80" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">(App/Browser)</text>
    </g>

    <!-- API / Server -->
    <g transform="translate(340, 150)">
        <rect x="0" y="0" width="120" height="100" rx="10" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2"/>
        <text x="60" y="55" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16">API / Server</text>
        <text x="60" y="80" text-anchor="middle" fill="#e0f2fe" font-family="sans-serif" font-size="12">(Flask)</text>
    </g>

    <!-- Database -->
    <g transform="translate(580, 150)">
        <path d="M0,20 C0,10 27,0 60,0 C93,0 120,10 120,20 L120,80 C120,90 93,100 60,100 C27,100 0,90 0,80 Z" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
        <ellipse cx="60" cy="20" rx="60" ry="20" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
        <text x="60" y="60" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16">Database</text>
        <text x="60" y="85" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">(SQLite)</text>
    </g>

    <!-- Arrows -->
    <!-- Request -->
    <path d="M230,180 L330,180" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="280" y="170" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="12">Request (JSON)</text>

    <!-- Query -->
    <path d="M470,180 L570,180" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="520" y="170" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="12">Query</text>

    <!-- Data -->
    <path d="M570,220 L470,220" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="520" y="240" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="12">Data</text>

    <!-- Response -->
    <path d="M330,220 L230,220" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="280" y="240" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="12">Response (JSON)</text>

    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="currentColor"/>
        </marker>
    </defs>
</svg>
