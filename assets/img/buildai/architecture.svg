<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0f172a" rx="10" ry="10"/>

  <!-- Nodes -->
  <!-- Scraper -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="35" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Web Scraper</text>
    <text x="60" y="55" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">(Python/Selenium)</text>
  </g>

  <!-- Database -->
  <g transform="translate(250, 100)">
    <rect x="0" y="0" width="140" height="180" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="70" y="30" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Multimodal DB</text>
    
    <!-- Vector DB -->
    <rect x="20" y="50" width="100" height="50" rx="4" fill="#334155"/>
    <text x="70" y="80" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Vector Store</text>
    
    <!-- Graph DB -->
    <rect x="20" y="110" width="100" height="50" rx="4" fill="#334155"/>
    <text x="70" y="140" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Graph DB</text>
  </g>

  <!-- LLM -->
  <g transform="translate(470, 150)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="60" y="35" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">LLM Engine</text>
    <text x="60" y="55" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">(Mistral 8B)</text>
  </g>

  <!-- App -->
  <g transform="translate(670, 150)">
    <rect x="0" y="0" width="100" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="50" y="35" font-family="sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Mobile App</text>
    <text x="50" y="55" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">(Flutter)</text>
  </g>

  <!-- Connections -->
  <line x1="170" y1="190" x2="250" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="190" x2="470" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="190" x2="670" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="210" y="180" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Raw Data</text>
  <text x="430" y="180" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Context</text>
  <text x="630" y="180" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Response</text>

</svg>
