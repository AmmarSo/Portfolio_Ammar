<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="300" fill="#0f172a" rx="10" ry="10"/>

  <!-- Steps -->
  <g transform="translate(50, 100)">
    <circle cx="50" cy="50" r="40" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="50" y="55" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">1. Query</text>
  </g>

  <g transform="translate(250, 100)">
    <circle cx="50" cy="50" r="40" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="50" y="45" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">2. Semantic</text>
    <text x="50" y="65" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Search</text>
  </g>

  <g transform="translate(450, 100)">
    <circle cx="50" cy="50" r="40" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="50" y="45" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">3. Content</text>
    <text x="50" y="65" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Generation</text>
  </g>

  <g transform="translate(650, 100)">
    <circle cx="50" cy="50" r="40" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="50" y="45" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">4. Course</text>
    <text x="50" y="65" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Creation</text>
  </g>

  <!-- Arrows -->
  <line x1="140" y1="150" x2="210" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="150" x2="410" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="150" x2="610" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
