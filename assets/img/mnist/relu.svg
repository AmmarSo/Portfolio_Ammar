<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#0f172a" rx="10" ry="10"/>
    
    <text x="200" y="30" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">ReLU Activation Function</text>
    
    <!-- Axes -->
    <line x1="50" y1="250" x2="350" y2="250" stroke="white" stroke-width="2"/> <!-- X axis -->
    <line x1="200" y1="280" x2="200" y2="50" stroke="white" stroke-width="2"/> <!-- Y axis -->
    
    <!-- Grid/Ticks -->
    <text x="340" y="270" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">x</text>
    <text x="180" y="60" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">f(x)</text>
    <text x="200" y="270" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">0</text>

    <!-- ReLU Line -->
    <!-- For x < 0, y = 0. For x > 0, y = x -->
    <polyline points="
        50,250 
        200,250 
        350,100" 
        fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        
    <text x="280" y="150" fill="#ef4444" font-family="sans-serif" font-size="14">f(x) = max(0, x)</text>

</svg>
