<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#grad1)"/>
    
    <!-- Neural Network Connections -->
    <g stroke="#0ea5e9" stroke-width="1" opacity="0.4">
        <line x1="100" y1="100" x2="400" y2="300" />
        <line x1="100" y1="200" x2="400" y2="300" />
        <line x1="100" y1="300" x2="400" y2="300" />
        <line x1="100" y1="400" x2="400" y2="300" />
        <line x1="100" y1="500" x2="400" y2="300" />
        
        <line x1="700" y1="150" x2="400" y2="300" />
        <line x1="700" y1="250" x2="400" y2="300" />
        <line x1="700" y1="350" x2="400" y2="300" />
        <line x1="700" y1="450" x2="400" y2="300" />
    </g>

    <!-- Nodes -->
    <circle cx="400" cy="300" r="20" fill="#0ea5e9" filter="url(#glow)" />
    
    <!-- Input Nodes -->
    <circle cx="100" cy="100" r="10" fill="#64748b" />
    <circle cx="100" cy="200" r="10" fill="#64748b" />
    <circle cx="100" cy="300" r="10" fill="#64748b" />
    <circle cx="100" cy="400" r="10" fill="#64748b" />
    <circle cx="100" cy="500" r="10" fill="#64748b" />

    <!-- Output Nodes -->
    <circle cx="700" cy="150" r="10" fill="#8b5cf6" />
    <circle cx="700" cy="250" r="10" fill="#8b5cf6" />
    <circle cx="700" cy="350" r="10" fill="#8b5cf6" />
    <circle cx="700" cy="450" r="10" fill="#8b5cf6" />

    <!-- Digit Representation (Grid) -->
    <g transform="translate(350, 250) scale(0.5)" opacity="0.8">
        <rect x="0" y="0" width="200" height="200" fill="none" stroke="#white" stroke-width="2"/>
        <!-- A simple '7' shape -->
        <polyline points="40,40 160,40 80,160" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <text x="400" y="550" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24" letter-spacing="2">NEURAL NETWORK</text>
</svg>
