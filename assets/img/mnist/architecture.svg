<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#0f172a" rx="10" ry="10"/>
    
    <text x="300" y="30" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">Basic Neural Network Architecture</text>
    
    <!-- Layer Labels -->
    <text x="100" y="280" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Input Layer</text>
    <text x="300" y="280" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Hidden Layer</text>
    <text x="500" y="280" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Output Layer</text>

    <!-- Connections -->
    <g stroke="#475569" stroke-width="1">
        <!-- Input to Hidden -->
        <line x1="100" y1="100" x2="300" y2="80" />
        <line x1="100" y1="100" x2="300" y2="150" />
        <line x1="100" y1="100" x2="300" y2="220" />
        
        <line x1="100" y1="150" x2="300" y2="80" />
        <line x1="100" y1="150" x2="300" y2="150" />
        <line x1="100" y1="150" x2="300" y2="220" />
        
        <line x1="100" y1="200" x2="300" y2="80" />
        <line x1="100" y1="200" x2="300" y2="150" />
        <line x1="100" y1="200" x2="300" y2="220" />

        <!-- Hidden to Output -->
        <line x1="300" y1="80" x2="500" y2="120" />
        <line x1="300" y1="80" x2="500" y2="180" />
        
        <line x1="300" y1="150" x2="500" y2="120" />
        <line x1="300" y1="150" x2="500" y2="180" />
        
        <line x1="300" y1="220" x2="500" y2="120" />
        <line x1="300" y1="220" x2="500" y2="180" />
    </g>

    <!-- Nodes -->
    <!-- Input -->
    <circle cx="100" cy="100" r="15" fill="#0ea5e9" />
    <circle cx="100" cy="150" r="15" fill="#0ea5e9" />
    <circle cx="100" cy="200" r="15" fill="#0ea5e9" />
    
    <!-- Hidden -->
    <circle cx="300" cy="80" r="15" fill="#8b5cf6" />
    <circle cx="300" cy="150" r="15" fill="#8b5cf6" />
    <circle cx="300" cy="220" r="15" fill="#8b5cf6" />

    <!-- Output -->
    <circle cx="500" cy="120" r="15" fill="#10b981" />
    <circle cx="500" cy="180" r="15" fill="#10b981" />

</svg>
