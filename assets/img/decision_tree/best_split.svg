<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="500" height="250" fill="#0f172a" rx="10" ry="10"/>

  <!-- Parent Node -->
  <g transform="translate(250, 40)">
    <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Parent</text>
    <text x="0" y="45" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Impurity(D)</text>
  </g>

  <!-- Split -->
  <line x1="250" y1="70" x2="150" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="70" x2="350" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Condition -->
  <rect x="200" y="90" width="100" height="20" rx="4" fill="#334155"/>
  <text x="250" y="104" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Feature ≤ Threshold?</text>

  <!-- Child Nodes -->
  <g transform="translate(150, 180)">
    <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Left</text>
    <text x="0" y="45" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Impurity(L)</text>
  </g>

  <g transform="translate(350, 180)">
    <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Right</text>
    <text x="0" y="45" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Impurity(R)</text>
  </g>

</svg>
