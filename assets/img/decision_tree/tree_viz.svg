<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="600" height="300" fill="#0f172a" rx="10" ry="10"/>

  <!-- Root -->
  <g transform="translate(300, 40)">
    <rect x="-60" y="-20" width="120" height="40" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Sex <= 0.5?</text>
  </g>

  <!-- Level 1 -->
  <line x1="300" y1="60" x2="150" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="60" x2="450" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(150, 140)">
    <rect x="-50" y="-20" width="100" height="40" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Age <= 9.5?</text>
  </g>

  <g transform="translate(450, 140)">
    <rect x="-50" y="-20" width="100" height="40" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Pclass <= 2.5?</text>
  </g>

  <!-- Level 2 (Leaves) -->
  <line x1="150" y1="160" x2="80" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="160" x2="220" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g transform="translate(80, 240)">
    <circle cx="0" cy="0" r="20" fill="#334155" stroke="#ef4444" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Died</text>
  </g>
  <g transform="translate(220, 240)">
    <circle cx="0" cy="0" r="20" fill="#334155" stroke="#22c55e" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Surv</text>
  </g>

</svg>
